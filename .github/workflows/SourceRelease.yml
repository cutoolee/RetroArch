name: CI Generate Source Only Tarball

# Trigger whenever a release and/or is created
on:
  release:
    types:
      - created
  push:
    tags:
      - "v*.*"

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    if: ${{ !startsWith(github.ref_name, 'gamego-v') && !startsWith(github.event.release.tag_name, 'gamego-v') }}
    permissions:
      contents: write
    name: build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: archive
      id: archive
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      run: |
        VERSION=${RELEASE_TAG#v}
        PKGNAME="retroarch-source-$VERSION"
        TARBALL="$PKGNAME.tar.gz"
        git archive --format=tar --prefix="$PKGNAME/" HEAD | gzip > "$TARBALL"
        echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

    - name: upload tarball
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.archive.outputs.tarball }}
