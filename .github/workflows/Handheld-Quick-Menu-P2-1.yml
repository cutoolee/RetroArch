name: Handheld Quick Menu P2.1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bridge-and-ui:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36, Build Tools 36 and NDK 29
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Prepare RetroArch frontend assets
        run: |
          ANDROID_ASSETS_DIR="$GITHUB_WORKSPACE/pkg/android/phoenix/assets" \
            handheld/distribution/prepare_android_assets.sh
      - name: Prepare stable development signing
        env:
          DEV_KEYSTORE_B64: ${{ secrets.RETROARCH_DEV_KEYSTORE_B64 }}
          DEV_STORE_PASSWORD: ${{ secrets.RETROARCH_DEV_STORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.RETROARCH_DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.RETROARCH_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$DEV_KEYSTORE_B64" ] && [ -n "$DEV_STORE_PASSWORD" ] \
              && [ -n "$DEV_KEY_ALIAS" ] && [ -n "$DEV_KEY_PASSWORD" ]; then
            dev_store="$RUNNER_TEMP/retroarch-development.jks"
            printf '%s' "$DEV_KEYSTORE_B64" | base64 --decode > "$dev_store"
            {
              echo "DEV_STORE_FILE=$dev_store"
              echo "DEV_STORE_PASSWORD=$DEV_STORE_PASSWORD"
              echo "DEV_KEY_ALIAS=$DEV_KEY_ALIAS"
              echo "DEV_KEY_PASSWORD=$DEV_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo 'DEVELOPMENT_SIGNING=STABLE_SECRET' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'DEVELOPMENT_SIGNING=NOT_CONFIGURED (debug fallback; device install blocked)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate P2.1 host contracts
        run: |
          validation/p2-1/scripts/check-evidence.sh
          validation/p2-1/scripts/check-gamego-package.sh
          validation/p2-1/scripts/run-validation.sh
      - name: Validate UI boundary and layout
        run: validation/p2/tests/test_quick_menu.sh
      - name: Validate runtime bridge lifecycle
        run: validation/p2.1/tests/test_bridge.sh
      - name: Validate GR0006 physical menu profile
        run: validation/p2.1/tests/test_gr0006_menu_profile.sh
      - name: Build Quick Menu enabled AArch64 APK
        working-directory: pkg/android/phoenix
        run: |
          ./gradlew clean assembleAarch64Debug --no-daemon \
            -PGAMEGO_PRODUCT=1 \
            -PHAVE_HANDHELD_RUNTIME=1 \
            -PHAVE_HANDHELD_QUICK_MENU=1
      - name: Capture enabled APK evidence
        run: |
          set -euo pipefail
          apk="$(find pkg/android/phoenix/build/outputs -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          mkdir -p handheld-dist/p2-1
          cp "$apk" handheld-dist/p2-1/RetroArch-p2.1-aarch64.apk
          echo 'PRODUCT=GameGo' | tee handheld-dist/p2-1/PRODUCT.txt
          sha256sum handheld-dist/p2-1/RetroArch-p2.1-aarch64.apk \
            | tee handheld-dist/p2-1/APK_SHA256.txt
          build_tools="${ANDROID_HOME}/build-tools/36.0.0"
          "$build_tools/aapt2" dump packagename \
            handheld-dist/p2-1/RetroArch-p2.1-aarch64.apk \
            | tee handheld-dist/p2-1/APPLICATION_ID.txt
          test "$(cat handheld-dist/p2-1/APPLICATION_ID.txt)" = "com.cutoolee.gamego"
          ! grep -Eq 'com\.retroarch\.aarch64|\.p1b2|\.validation|\.p2' \
            handheld-dist/p2-1/APPLICATION_ID.txt
          "$build_tools/aapt2" dump badging \
            handheld-dist/p2-1/RetroArch-p2.1-aarch64.apk \
            | grep -F "application-label:'GameGo'" \
            | tee handheld-dist/p2-1/APP_NAME.txt
          unzip -l handheld-dist/p2-1/RetroArch-p2.1-aarch64.apk \
            | grep -F 'lib/arm64-v8a/' >/dev/null
          "$build_tools/aapt2" dump xmltree \
            handheld-dist/p2-1/RetroArch-p2.1-aarch64.apk \
            --file AndroidManifest.xml \
            | grep -F 'com.cutoolee.gamego.documents' >/dev/null
          if [ -x "$build_tools/apksigner" ]; then
            "$build_tools/apksigner" verify --print-certs \
              handheld-dist/p2-1/RetroArch-p2.1-aarch64.apk \
              | tee handheld-dist/p2-1/SIGNING_CERTIFICATE.txt
            grep -qi 'bdb5298adf85b5cb9f7adcd83dc181356ac53e7a58e61c9ff7fb5b80a722b66f' \
              handheld-dist/p2-1/SIGNING_CERTIFICATE.txt
          else
            echo 'APKSIGNER=NOT_FOUND' | tee handheld-dist/p2-1/SIGNING_CERTIFICATE.txt
            exit 1
          fi
          printf '%s\n' \
            'PACKAGE_ID_GATE=PASS' \
            'DATA_ROOT_GATE=PASS' \
            'AUTHORITY_GATE=PASS' \
            'SIGNING_GATE=PASS' \
            'ABI_GATE=PASS' \
            'NO_VALIDATION_SUFFIX_GATE=PASS' \
            | tee handheld-dist/p2-1/PRODUCT_GATES.txt
      - name: Validate feature-off Android configuration
        working-directory: pkg/android/phoenix
        run: ./gradlew assembleAarch64Debug --no-daemon -PGAMEGO_PRODUCT=1 -PHAVE_HANDHELD_RUNTIME=0 -PHAVE_HANDHELD_QUICK_MENU=0
      - name: Verify APK assets
        run: |
          find pkg/android/phoenix/build/outputs -type f -name '*.apk' -print
          test -n "$(find pkg/android/phoenix/build/outputs -type f -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: handheld-p2-1-aarch64
          path: handheld-dist/p2-1
