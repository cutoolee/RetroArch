title = "GameGo secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Public cryptographic fixtures verified by the working-tree hash audit"
paths = [
  '''^handheld/distribution/public-test-keys\.json$''',
  '''^deps/bearssl-0\.6/samples/key-(ee|ica|root)-(ec|rsa)\.pem$''',
  '''^deps/mbedtls/(certs|pkparse|pkwrite)\.c$''',
  '''^deps/(libsmb2/lib/aes_reference|rcheevos/src/rhash/aes|bearssl-0\.6/test/test_crypto)\.c$''',
]
